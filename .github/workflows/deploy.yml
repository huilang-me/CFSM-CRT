name: build-theme

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theme-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install
        run: npm ci

      # dist 分支是通用产物，忽略 Secrets 与 .env 中的所有站点配置
      - name: build
        run: npm run build
        env:
          IGNORE_ENV: '1'

      - name: publish to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%s)"
          SRC="$(git rev-parse --short HEAD)"

          rm -rf publish
          mkdir publish
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch --depth=1 origin dist; then
            git checkout -q -B dist FETCH_HEAD
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git checkout -q --orphan dist
          fi

          cp -R ../dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "dist is already up to date"
            exit 0
          fi
          git commit -q -m "${MSG}" -m "source: ${SRC}"
          git push origin dist
